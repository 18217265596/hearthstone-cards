<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080f17">
<title>机械克苏恩 · 12s Loop</title>
<style>
  * {box-sizing:border-box}
  :root { color-scheme:dark; --safe:env(safe-area-inset-bottom,0px); }
  html,body {width:100%;height:100%;margin:0;overflow:hidden;background:#080d15}
  body {font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#d7cca9}
  main {isolation:isolate;position:relative;display:grid;place-items:center;height:100%;height:100svh;
    padding:18px 14px 24px;background:radial-gradient(ellipse at 48% 28%,#213040 0%,#111c28 41%,#090f18 74%,#070b11 100%)}
  #surround {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
  .card {--cardH:min(calc(100svh - 42px),calc((100vw - 30px) * 563 / 414));position:relative;
    width:calc(var(--cardH) * 414 / 563);height:var(--cardH);margin:0;isolation:isolate;
    filter:drop-shadow(0 14px 24px #0009) drop-shadow(0 2px 4px #000d)}
  .picture {position:absolute;left:3.6231884%;top:2.4866785%;width:92.7536232%;height:90.9413854%;overflow:hidden;background:#101c30}
  .picture canvas,.frame {display:block;position:absolute;width:100%;height:100%;inset:0}
  #fx {mix-blend-mode:screen;pointer-events:none}
  .frame {pointer-events:none}
  figcaption {position:absolute;inset:93.51% 18% 1.9%;display:grid;align-items:center;justify-content:center;pointer-events:none;
    font:600 calc(var(--cardH) * .0233)/1.1 "STKaiti","KaiTi","Noto Serif SC","SimSun",serif;letter-spacing:.21em;
    padding-left:.21em;color:#e3c48a;text-shadow:0 1px 1px #050608,0 -1px 1px #382815}
  .transport {position:absolute;right:max(24px,env(safe-area-inset-right));bottom:calc(22px + var(--safe));
    display:flex;align-items:center;gap:12px;min-height:34px;padding:0 8px;
    background:linear-gradient(110deg,#111b24e6,#0a1018e6);border:1px solid #9f92713d;border-radius:4px;
    box-shadow:0 3px 16px #0002;transition:opacity .2s;user-select:none}
  button {display:grid;place-items:center;appearance:none;background:none;color:#d2c19a;padding:0;border:0;cursor:pointer;
    touch-action:manipulation;width:26px;height:30px;border-radius:2px}
  button:hover,button:focus-visible {color:#fff0cc;background:#cbb78b13}
  button:focus-visible,input:focus-visible {outline:1px solid #edcf92;outline-offset:2px}
  button svg {width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
  .loop-label {font:500 11px/1.1 "Segoe UI",sans-serif;letter-spacing:.045em;color:#dbd5c4;white-space:nowrap}
  .track {position:relative;width:52px;height:28px;display:flex;align-items:center;--p:0}
  .rail {display:block;height:2px;width:100%;background:#5b5d5b;position:relative;pointer-events:none}
  .rail i {position:absolute;inset:0;background:linear-gradient(90deg,#8c7244,#f6d79b);transform-origin:0 50%;transform:scaleX(var(--p))}
  input[type=range] {position:absolute;inset:0;margin:0;width:100%;height:100%;opacity:0;cursor:ew-resize}
  .track:focus-within {outline:1px solid #cbb78b9c;outline-offset:2px}
  #hide {border-left:1px solid #9c927b31;padding-left:7px;width:30px}
  #restore {position:absolute;right:24px;bottom:calc(22px + var(--safe));color:#d8c69c;background:#111922b3;
    border:1px solid #9f927143;width:34px;height:30px;transition:opacity .25s}
  #restore.quiet:not(:focus-visible):not(:hover) {opacity:0}
  [hidden] {display:none!important}
  .play-glyph {display:none}
  [data-paused=true] .play-glyph {display:block}
  [data-paused=true] .pause-glyph {display:none}
  @media(max-aspect-ratio: 13/12) {
    main {padding:12px 8px calc(56px + var(--safe))}
    .card {--cardH:min(calc(100svh - 68px - var(--safe)),calc((100vw - 16px) * 563 / 414))}
    .transport,#restore {bottom:calc(11px + var(--safe));right:14px}
  }
  @media(max-height:430px) and (min-aspect-ratio:13/12) {
    main {padding:5px}
    .card {--cardH:calc(100svh - 10px)}
    .transport {right:8px;bottom:8px;gap:5px}.track {width:32px}
  }
</style>
<main aria-label="机械克苏恩动态金色卡牌">
  <canvas id="surround" aria-hidden="true"></canvas>
  <figure class="card">
    <div class="picture" role="img" aria-label="机械克苏恩托起熔金竖眼，带刺的机械眼柄探出电光闪烁的冷却池。">
      <canvas id="scene" aria-hidden="true"></canvas>
      <canvas id="fx" aria-hidden="true"></canvas>
    </div>
    <canvas class="frame" id="frame" aria-hidden="true"></canvas>
    <figcaption>机械克苏恩</figcaption>
  </figure>
  <div class="transport" role="group" aria-label="循环审片">
    <button id="play" type="button" aria-label="暂停" title="暂停 / 播放（空格）">
      <svg class="pause-glyph" viewBox="0 0 16 16"><path d="M5.5 3.5v9m5-9v9" stroke-width="2"/></svg>
      <svg class="play-glyph" viewBox="0 0 16 16"><path d="m5 3 7.5 5L5 13Z" fill="currentColor" stroke="none"/></svg>
    </button>
    <span class="loop-label" lang="en">12s Loop</span>
    <div class="track"><span class="rail"><i></i></span><input type="range" min="0" max="12000" value="0" aria-label="循环播放位置（毫秒）" title="拖动审片"></div>
    <button id="hide" type="button" aria-label="隐藏审片条" title="隐藏审片条（H）"><svg viewBox="0 0 18 18"><path d="M2 9s2.4-4.5 7-4.5S16 9 16 9s-2.4 4.5-7 4.5S2 9 2 9Z"/><circle cx="9" cy="9" r="1.9"/><path d="m2.5 2.5 13 13"/></svg></button>
  </div>
  <button hidden id="restore" type="button" aria-label="显示审片条" title="显示审片条（H）"><svg viewBox="0 0 18 18"><path d="M2 9s2.4-4.5 7-4.5S16 9 16 9s-2.4 4.5-7 4.5S2 9 2 9Z"/><circle cx="9" cy="9" r="1.9"/></svg></button>
</main>
<script>
"use strict";
/* Cast bronze surround. All ornament, abrasions and engraving are drawn at startup. */
function seededBrush(seed) {
  return () => {
    seed = (Math.imul(1664525,seed) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
}
function drawFrame(el) {
  const s = 2.5, W = 414, H = 563;
  el.width = Math.round(W*s); el.height = Math.round(H*s);
  const c = el.getContext('2d');
  c.scale(el.width/W,el.height/H);
  const rnd = seededBrush(429), polygon = (d,fill,stroke,width=1) => {
    const p = new Path2D(d);
    if (fill) {c.fillStyle=fill;c.fill(p)}
    if (stroke) {c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p)}
  };
  function gradient(x,y,X,Y,stops) {
    const g=c.createLinearGradient(x,y,X,Y);
    stops.forEach(([v,col])=>g.addColorStop(v,col));return g;
  }
  const alloy = gradient(0,0,390,480,[[0,'#cfb785'],[.047,'#645039'],[.15,'#292a2b'],[.29,'#685a41'],[.48,'#463d32'],[.7,'#3c3b38'],[.89,'#786244'],[1,'#342d27']]);
  const lip = gradient(0,0,413,564,[[0,'#e3ce93'],[.18,'#725d3d'],[.29,'#a68d64'],[.55,'#4b4437'],[.81,'#ba9a68'],[1,'#625440']]);
  const wall = 'M12 1H402L413 12V550L401 562H13L1 550V12Z';
  const mid = 'M14 4H400L410 14V549L399 559H15L4 548V14Z';
  polygon(wall,'#1b1b1d','#090b0c',1.3);
  polygon(mid,alloy,lip,1.25);
  polygon('M16 7H398L407 16V546L397 555.5H17L7 546V16Z',null,'#181b1b',1.3);
  polygon('M18 9H396L404 17V543L395 552H19L10 543V17Z',null,'#ae94704a',.8);
  polygon('M13 12H401V528H13Z','#0b1117','#191816',2.0);
  polygon('M14 13H400V527H14Z',null,lip,1.2);
  c.save();c.clip(new Path2D(wall));
  for(let i=0;i<9300;i++) {
    const x=rnd()*W,y=rnd()*H;
    if(x>14&&x<400&&y>13&&y<527) continue;
    c.fillStyle=rnd()<.47?'#181515':'#e0c598';c.globalAlpha=.06+rnd()*.26;
    c.fillRect(x,y,.17+rnd()*1.15,.12+rnd()*.36);
  }
  c.restore();
  c.clearRect(15,14,384,512);
  function corners(right, bottom) {
    c.save();c.translate(right?414:0,bottom?563:0);c.scale(right?-1:1,bottom?-1:1);
    const filigree='M4.5 28V14L13.5 5H53L44 8H20L11 17V40L8 46V21L16.5 11H34';
    polygon(filigree,null,'#201e1b',2.2);polygon(filigree,null,lip,.94);
    polygon('M7 16.5 17 7H30L20 9.4 9.5 20 7 29Z',alloy,'#c8af79',.5);
    polygon('M12 16.5 16.7 12H23L17 13.6 13.7 17 12 23Z','#c2a476');
    c.restore();
  }
  corners(false,false);corners(true,false);corners(false,true);corners(true,true);
  const nameplate=gradient(0,527,0,557,[[0,'#1b2021'],[.12,'#776249'],[.18,'#443b30'],[.47,'#2c2925'],[.88,'#252627'],[1,'#6a5840']]);
  polygon('M105 534H136L144 528H270L278 534H309L300 541H277L268 552H146L137 541H114Z','#262829','#9f8661',.95);
  polygon('M141 536 147 530H267L274 536 265 549H149Z',nameplate,'#c1a571',.75);
  polygon('M151 532H264M152 547H262',null,'#9d88684d',.65);
  for(const side of [-1,1]){
    c.save();c.translate(207,0);c.scale(side,1);
    polygon('M64 542H75L79 538H115L124 535H177',null,'#171a1a',1.8);
    polygon('M64 541H75L79 537.5H115L124 534.5H177',null,'#b79c70',.65);
    polygon('M130 538H160L166 535',null,'#a48c6673',.7);
    for(const y of [77,280,481]){
      polygon('M199 '+(y-9)+'v18l2-4v-9Z','#222324','#a9926b',.45);
    }
    c.restore();
  }
  // A small faceted keystone catches the key light on the upper bezel.
  polygon('M172 5H193L200 2.8H214L221 5H242L234 7H218L207 13 196 7H180Z',alloy,'#c6ab78',.55);
  polygon('M201 6.1 207 3.8 213 6.1 207 10.8Z','#504b42','#c8ae7d',.5);
  polygon('M202 6.2 207 4.6 206.7 8.7Z','#dabf84');
}

/* A low-frequency reflection of the painted scene colors the space around the card. */
function drawSurround(el,art) {
  const rect=el.getBoundingClientRect(), w=el.width=Math.max(2,Math.round(rect.width*.55)),h=el.height=Math.max(2,Math.round(rect.height*.55));
  const c=el.getContext('2d'),rng=seededBrush(337);
  c.fillStyle='#090f16';c.fillRect(0,0,w,h);
  c.save();c.globalAlpha=.22;c.filter='blur('+Math.max(18,h*.086)+'px)';
  c.drawImage(art,-w*.06,-h*.34,w*1.12,h*1.5);c.restore();
  let g=c.createRadialGradient(w*.50,h*.40,h*.21,w*.50,h*.45,Math.max(w*.59,h*.75));
  g.addColorStop(0,'#15212c08');g.addColorStop(.54,'#0c16206b');g.addColorStop(1,'#070b12ea');c.fillStyle=g;c.fillRect(0,0,w,h);
  // Scribed arcs are barely visible outside the artwork, like tooling marks in blued steel.
  c.save();c.translate(w*.50,h*.44);c.lineWidth=.48;
  for(const k of [.51,.515,.68,.686,.91]){
    c.beginPath();c.arc(0,0,h*k,0,Math.PI*2);c.strokeStyle=k<.52?'#b2a68d19':'#a3afbd0c';c.stroke();
  }
  c.restore();
  for(let i=0;i<w*h*.085;i++){
    c.fillStyle=rng()<.48?'#c2d3dc0b':'#00000014';
    c.fillRect(rng()*w,rng()*h,.45+rng()*.7,.55);
  }
}

/**
 * Irregular pigment anchors define the broad color/value planes of the study.
 * A shared-edge Gouraud mesh interpolates these pigments. Curved brush dabs
 * above it follow the local tool marks and reveal chips, scratches and water.
 * The three binary tables describe vertices, triangle indices and Bézier dabs.
 * All geometry is in the 384 x 512 painting's local coordinate system.
 */
function paintIllustration(ctx) {
  const bytes = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
  const anchors=bytes(document.getElementById('painting-anchors').textContent);
  const topology=bytes(document.getElementById('painting-topology').textContent);
  const dabs=bytes(document.getElementById('painting-dabs').textContent);
  const word = (a, i) => a[i] | a[i+1] << 8;
  const signed = x => x & 128 ? x-256 : x;
  const source = document.createElement('canvas');
  const scale = Math.min(3, Math.max(1, Math.abs(ctx.getTransform().a)));
  const W = source.width = Math.round(384*scale);
  const H = source.height = Math.round(512*scale);
  const ink = source.getContext('2d');
  const pigment = ink.createImageData(W,H);
  const pixels = pigment.data;
  const sx=(W-1)/383, sy=(H-1)/511;
  for (let i=0; i<topology.length; i+=6) {
    const a=word(topology,i)*7, b=word(topology,i+2)*7, c=word(topology,i+4)*7;
    const x0=word(anchors,a)*sx, y0=word(anchors,a+2)*sy;
    const x1=word(anchors,b)*sx, y1=word(anchors,b+2)*sy;
    const x2=word(anchors,c)*sx, y2=word(anchors,c+2)*sy;
    const ax=x1-x0, ay=y1-y0, bx=x2-x0, by=y2-y0;
    const det=ax*by-ay*bx;
    const ia=by/det, ib=-bx/det, ic=-ay/det, id=ax/det;
    const r0=anchors[a+4],g0=anchors[a+5],b0=anchors[a+6];
    const ar=anchors[b+4]-r0,ag=anchors[b+5]-g0,ab=anchors[b+6]-b0;
    const br=anchors[c+4]-r0,bg=anchors[c+5]-g0,bb=anchors[c+6]-b0;
    const xMin=Math.ceil(Math.min(x0,x1,x2)),xMax=Math.floor(Math.max(x0,x1,x2));
    const yMax=Math.floor(Math.max(y0,y1,y2));
    for(let y=Math.ceil(Math.min(y0,y1,y2));y<=yMax;y++) {
      let u=(xMin-x0)*ia+(y-y0)*ib, v=(xMin-x0)*ic+(y-y0)*id;
      let dst=(y*W+xMin)*4;
      for(let x=xMin;x<=xMax;x++,dst+=4,u+=ia,v+=ic) {
        if(u<-.00001 || v<-.00001 || u+v>1.00001) continue;
        pixels[dst]=r0+ar*u+br*v;
        pixels[dst+1]=g0+ag*u+bg*v;
        pixels[dst+2]=b0+ab*u+bb*v;
        pixels[dst+3]=255;
      }
    }
  }
  ink.putImageData(pigment,0,0);
  ctx.save();
  ctx.drawImage(source,0,0,384,512);
  ctx.globalAlpha=.83;
  ctx.lineCap='round';
  for(let i=0;i<dabs.length;i+=12) {
    const x=word(dabs,i)/4+.5, y=word(dabs,i+2)/4+.5;
    const x0=x+signed(dabs[i+4])/8, y0=y+signed(dabs[i+5])/8;
    const x1=x+signed(dabs[i+6])/8, y1=y+signed(dabs[i+7])/8;
    const w=dabs[i+8]/32;
    ctx.strokeStyle='rgb('+dabs[i+9]+','+dabs[i+10]+','+dabs[i+11]+')';
    ctx.lineWidth=w;
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.quadraticCurveTo(x,y,x1,y1);
    ctx.stroke();
  }
  ctx.restore();
}

/* Finish the castings in painting space so that the microrelief follows the rig.
   Broad solvent glazes soften the vapor. Paired dark/light bristles describe
   directional wear at a much finer scale than the large pigment dabs. */
function finishMetal(c) {
  const rand=seededBrush(948051),tau=Math.PI*2;
  const sphere=new Path2D('M89.7 139C89.2 80.5 135 37 189.5 37.8C245 35.3 295.7 82.3 294.4 140.6Q294 151 291 162L289 179 282 188 289 169 261 200 264 164 244 189 223 198 225 151 206 188 180 189 159 153 161 192 138 186 123 162 131 193 103 171 109 191Q89 174 89.7 139Z');
  const eye=new Path2D('M192 63.2C220.4 94.5 224.6 144.2 192 185.6C162 154 158.4 100.2 192 63.2Z');
  const armor=new Path2D('M103 219L146 209 228 209 248 219 243 256 246 280 267 338 271 358 78 363 82 338 68 328 72 295 89 274Z');
  const nearArm=new Path2D('M114 300C102 298 90 307 81 320Q68 341 84 383L91 404Q82 423 73 402L46 366 54 398Q70 440 92 432C130 423 124 399 112 367Q106 340 115 329L130 326Z');
  const rightArm=new Path2D('M339 250Q341 191 302 205C254 192 226 259 251 303Q243 331 271 336C295 348 316 324 306 294Q300 280 274 276C248 242 298 192 325 221Z');
  const nearHook=new Path2D('M187 421C188 397 197 375 225 374C252 372 267 387 277 408C286 433 280 461 253 473Q269 450 263 432C253 398 217 393 204 414L204 426Z');
  const coping=new Path2D('M0 399Q189 435 384 397V512H0Z');
  const glaze=document.createElement('canvas');glaze.width=384;glaze.height=512;
  const g=glaze.getContext('2d',{willReadFrequently:true});
  g.filter='blur(1.8px)';g.drawImage(c.canvas,0,0,384,512);g.filter='none';
  const values=g.getImageData(0,0,384,512),d=values.data;
  const clamp=x=>Math.max(0,Math.min(1,x));
  for(let y=0;y<512;y++){
    for(let x=0;x<384;x++){
      const i=(y*384+x)*4,dx=(x-192)/104,dy=(y-138)/100,r=dx*dx+dy*dy;
      const cold=clamp((Math.min(d[i+2]-d[i],(d[i+2]+d[i+1])*.5-d[i])-6)/24);
      const fog=clamp((r-.96)*4)*clamp((335-y)/65)*cold;
      const shell=clamp((.96-r)*8)*clamp((179-y)/18)*clamp((Math.abs(x-192)-19)/7);
      const seam=clamp((Math.abs(y-116)-5)/8);
      d[i+3]=Math.round(255*Math.max(.67*fog,.54*shell*seam));
    }
  }
  g.putImageData(values,0,0);c.drawImage(glaze,0,0);
  function stroke(path,col,width) {c.strokeStyle=col;c.lineWidth=width;c.stroke(path)}
  function dash(x,y,dx,dy,curve,col,width) {
    c.strokeStyle=col;c.lineWidth=width;c.beginPath();c.moveTo(x,y);
    c.quadraticCurveTo(x+dx*.54+curve,y+dy*.50,x+dx,y+dy);c.stroke();
  }
  function scar(x,y,dx,dy,w,value) {
    c.globalAlpha=value;dash(x,y,dx,dy,.06,'#282327',w);
    c.globalAlpha=value*.86;dash(x+.08,y+.22,dx*.83,dy*.83,.06,'#edd7ae',w*.68);
  }
  c.save();c.clip(sphere);c.lineCap='round';
  const deviceScale=c.getTransform().a;
  // Direction of the polishing wheel follows meridians on the cast sphere.
  for(let i=0;i<17700;i++){
    const x=88+rand()*210,y=37+rand()*162;
    if(c.isPointInPath(eye,x*deviceScale,y*deviceScale))continue;
    const v=(x-191.5)/104,u=(y-37)/170;
    const edge=Math.sqrt(Math.max(0,1-v*v));
    const tilt=v*(1.12-1.48*u)+Math.sin(x*.073+y*.028)*.13;
    const len=.26+Math.pow(rand(),3)*(1.9+edge*2.1),a=.035+rand()*.13;
    c.globalAlpha=a;
    dash(x,y,tilt*len,len,(rand()-.5)*.19,rand()<.52?'#292a31':'#f2e8c7',.11+rand()*.29);
  }
  for(let i=0;i<700;i++){
    const x=92+rand()*200,y=45+rand()*144;
    if(Math.abs(x-192)<25)continue;
    const gap=rand(),len=.16+gap*gap*1.8;
    scar(x,y,(rand()-.55)*len,len*(.33+rand()),.18+rand()*.16,.13+rand()*.2);
  }
  c.restore();
  const seams=[
    'M91.5 134.7 94.6 122.5 100.1 120.6 104.4 126.9 119.2 122.4 123 111.1 136.4 108.3 143 115.7Q155.8 112.6 170.1 112.4',
    'M214.2 112.4Q225.4 112.9 240.2 115.9L245.6 108.3 260.4 111.2 263.7 121.4 278.7 126.4 282.5 120.6 287.3 122.8 291.7 135'
  ];
  for(const description of seams){
    const p=new Path2D(description);c.save();c.lineJoin='round';c.lineCap='round';
    c.translate(0,.66);stroke(p,'#e9cc976e',.47);
    c.translate(0,-.72);stroke(p,'#282c2cb0',.73);
    c.translate(0,-.62);stroke(p,'#97c8d7aa',.38);c.restore();
  }
  // Translucent vitreous core and the tiny asymmetric teeth on its hot bezel.
  c.save();c.clip(eye);
  const core=new Path2D('M192 83.2C198.1 99 200.8 139.4 191.5 164.2C184 145.8 184.7 105.5 192 83.2Z');
  const ink=c.createLinearGradient(184,0,199,0);
  ink.addColorStop(0,'#db5738');ink.addColorStop(.25,'#752139');ink.addColorStop(.52,'#351931');ink.addColorStop(.72,'#542036');ink.addColorStop(1,'#d84a30');
  c.globalAlpha=.66;c.fillStyle=ink;c.fill(core);
  c.globalAlpha=.55;stroke(core,'#ff682b',.38);
  for(let side of [-1,1]){
    for(let n=0;n<40;n++) {
      const f=(n+.7)/40.9,y=65.5+f*117;
      const width=22.15*Math.pow(Math.sin(Math.PI*f),.84),x=192+side*(width-.78);
      const inner=x-side*(.45+rand()*1.72);
      c.globalAlpha=.16+rand()*.32;
      dash(x,y,inner-x,.33+rand()*.56,side*.12,'#ffdd71',.44+rand()*.34);

  const w=384,h=512,make=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
  const src=make(),s=src.getContext('2d',{willReadFrequently:true});s.drawImage(art,0,0,w,h);
  const colors=s.getImageData(0,0,w,h),v=colors.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=4*(y*w+x),r=v[i],g=v[i+1],b=v[i+2];
    const hot=255*Math.max(0,Math.min(1,(r-b-23)/115))*Math.max(0,Math.min(1,(r-138)/106));

    const furnace=y>288&&y<365&&Math.abs(x-192)<18;
    v[i]=main?hot:0;v[i+1]=lens?hot:0;v[i+2]=furnace?hot:0;

// The source plate's engraved grain supplies the surface of the moving shutter.
vec3 shutter(vec3 base,vec2 p,vec2 center,vec2 radius,vec2 axis,float timing,float frequency) {
    vec2 local=p-center;
    vec2 point=vec2(dot(local,axis),dot(local,vec2(-axis.y,axis.x)))/radius;
    float rr=dot(point,point);

    float peak=cos(frequency*uPhase+timing);
    float close=smoothstep(.963,.996,peak);
    float aperture=(1.-close)*1.08;
    float plate=abs(point.y+.08*point.x*point.x)-aperture;
    float cover=smoothstep(-.025,.075,plate)*inside*close;
    float charge=(.5+.5*cos(frequency*uPhase+timing+1.10));
    vec3 color=base*(1.+warmth(base)*(.20*charge-.075));
    if(cover>.0001) {
        vec3 metal=pigment(vec2(143.+local.x*.65,229.+local.y*.38));
        float lip=(1.-smoothstep(.015,.18,abs(plate-.085)))*(.32+.28*max(0.,point.y));

function paintedSurface() {

function startPlayer() {
  const art=paintedSurface(), scene=byId('scene'), fx=byId('fx'), frame=byId('frame'), surround=byId('surround');
  const effects=makeEffects(), overlay=fx.getContext('2d'), clock=new PhaseClock();
  const track=document.querySelector('.track'), slider=track.querySelector('input'), group=document.querySelector('.transport'), play=byId('play');

  const picture=scene.parentElement;
  function draw(ms,now=performance.now(),force=false) {
    const t=wrapMs(ms)/LOOP_MS,l=effects.light(t);
    renderer.draw(t,l);
    overlay.setTransform(fx.width/ART_W,0,0,fx.height/ART_H,0,0);
    overlay.clearRect(0,0,ART_W,ART_H);
    effects.draw(overlay,t);
    track.style.setProperty('--p',t.toFixed(5));
    if(force||now-lastControl>120) {

      lastControl=now;

  }
  function resizeScene() {
    const rect=picture.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1);
    const scale=Math.min(dpr,3*ART_W/Math.max(1,rect.width))*quality;
    const width=Math.max(2,Math.round(rect.width*scale)),height=Math.max(2,Math.round(rect.height*scale));
    if(scene.width!==width||scene.height!==height){scene.width=width;scene.height=height}
    const fxWidth=Math.min(width,960),fxHeight=Math.round(fxWidth*ART_H/ART_W);
    if(fx.width!==fxWidth||fx.height!==fxHeight){fx.width=fxWidth;fx.height=fxHeight}
  }
  function resizeAll() {
    quality=1;windowStart=count=slowWindows=0;resizeScene();drawSurround(surround,art);
    draw(clock.elapsed(),performance.now(),true);
  }
  function animate(now) {
    request=0;if(!clock.playing||document.hidden)return;
    draw(clock.elapsed(now),now);
    if(!windowStart){windowStart=now;count=0}
    count++;
    if(now-windowStart>=1600){
      frameTime=(now-windowStart)/Math.max(1,count-1);
      slowWindows=frameTime>18.6?slowWindows+1:0;
      if(slowWindows>=2&&quality>.58){quality=Math.max(.58,quality*.84);resizeScene();slowWindows=0}
      count=0;windowStart=0;
    }
    request=requestAnimationFrame(animate);
  }

    if(request){cancelAnimationFrame(request);request=0}
    clock.setPlaying(on);play.dataset.paused=String(!on);
    play.setAttribute('aria-label',on?'暂停':'播放');play.title=on?'暂停（空格）':'播放（空格）';
    windowStart=count=0;draw(clock.elapsed(),performance.now(),true);schedule();
  }

    if(!Number.isFinite(ms))return;
    clock.seek(ms);draw(clock.elapsed(clock.anchor),clock.anchor,true);

    if(restore.hidden)return;
    restore.classList.remove('quiet');clearTimeout(fadeTimer);
    fadeTimer=setTimeout(()=>restore.classList.add('quiet'),1400);
  }
  function controls(visible) {
    group.hidden=!visible;restore.hidden=visible;
    if(!visible)showHandle();
  }
  byId('hide').onclick=()=>controls(false);restore.onclick=()=>{controls(true);play.focus()};
  play.onclick=()=>playState(!clock.playing);
  slider.addEventListener('input',()=>seek(Number(slider.value)));
  let resumeOnRelease=false;
  slider.addEventListener('pointerdown',()=>{resumeOnRelease=clock.playing;if(resumeOnRelease)playState(false)});
  const finishScrub=()=>{if(resumeOnRelease){resumeOnRelease=false;playState(true)}};
  window.addEventListener('pointerup',finishScrub);window.addEventListener('pointercancel',finishScrub);
  window.addEventListener('pointermove',showHandle,{passive:true});picture.addEventListener('pointerdown',showHandle);
  window.addEventListener('keydown',event=>{
    if(event.altKey||event.metaKey||event.ctrlKey)return;
    if(event.code==='KeyH'){controls(group.hidden);event.preventDefault()}
    if(event.code==='Space'&&event.target.tagName!=='BUTTON'){
      event.preventDefault();if(!event.repeat)playState(!clock.playing);
    }
  });
  document.addEventListener('visibilitychange',()=>{
    if(request)cancelAnimationFrame(request);request=0;windowStart=count=0;schedule();
  });
  scene.addEventListener('webglcontextlost',e=>{e.preventDefault();if(request)cancelAnimationFrame(request);request=0});
  scene.addEventListener('webglcontextrestored',()=>{renderer=new ShaderRenderer(gl,art,emission);resizeAll();schedule()});
  drawFrame(frame);resizeAll();
  const observer=new ResizeObserver(resizeAll);observer.observe(picture);
  window.addEventListener('resize',resizeAll);
  /* Millisecond transport for frame-accurate review and deterministic offline capture. */
  window.cardReview=Object.freeze({seek,pause:()=>playState(false),play:()=>playState(true),
    time:()=>wrapMs(clock.elapsed()),controls,renderer:gl?'WebGL':'Canvas 2D',
    stats:()=>({width:scene.width,height:scene.height,frameTime})});
  clock.seek(0);draw(0,performance.now(),true);schedule();
}
document.addEventListener('DOMContentLoaded',startPlayer,{once:true});
